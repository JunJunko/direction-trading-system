<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>结构与保护独立审核</title>
<style>
body{font:16px/1.7 system-ui;margin:28px auto;max-width:1200px;padding:0 20px;background:#f5f7fa;color:#223047}header{padding-bottom:16px}button,input,select{font:inherit;padding:7px 12px;border:1px solid #bac6d5;border-radius:5px;background:white}button{cursor:pointer}nav{position:sticky;top:0;background:#f5f7fa;padding:12px 0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}canvas{width:100%;height:310px;background:white;border:1px solid #d5dfeb}label{display:block;margin:12px 0}label.inline{display:inline-block;margin-right:20px}textarea{width:95%;height:90px;font:inherit;padding:12px}#tip{font:14px monospace;min-height:26px}#status{color:#526c89}small{color:#53667c}.form{padding:20px;background:white;border:1px solid #d5dfeb}a{color:#245caf}
</style>
<header><h1>结构与保护独立审核</h1><p>图形截止观察日。先自行判断，再按需显示算法候选。页面不载入后续行情、收益或实验分组。人工判断用于核对定义，不直接代表交易优势。</p>
<label>审核人 <input id="reviewer" placeholder="姓名或固定代号"></label>
<label><input type="checkbox" id="independent"> 我会独立判断；对于已知后续走势的案例，会逐项标记</label>
<small>部分案例来自上一轮；若你曾看过对应后续行情，请勾选案例内的“已知后续”。不确定时可选择“看不准”。</small></header>
<nav><button id="prev">上一例</button><strong id="count"></strong><button id="next">下一例</button><label class="inline"><input id="annotations" type="checkbox">显示算法候选</label><button id="export">导出审核JSON</button><span id="status"></span></nav>
<h2 id="title"></h2><div id="charts"></div><div id="tip"></div>
<div class="form"><label><input type="checkbox" id="seen">我已知这个案例的后续走势或交易结果</label><div id="fields"></div><label>理由或备选结构日期<textarea id="note" placeholder="请说明判断依据；可写出你认为更合理的波峰/波谷日期"></textarea></label></div>
<script>
const cases=__CASES__,run='__RUN__',caseHash='__HASH__';
const storageKey='research-stage-'+run;let current=0,state={reviewer:'',independent:false,labels:{}};
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.case_hash===caseHash)state=saved}catch(e){}
const fields=['structure','ownership','timing'];
function persist(){state.case_hash=caseHash;state.run=run;try{localStorage.setItem(storageKey,JSON.stringify(state));document.getElementById('status').textContent='草稿已保存'}catch(e){document.getElementById('status').textContent='草稿保存失败，请导出'}}
function save(){const c=cases[current],v=Object.fromEntries(fields.map(k=>[k,document.getElementById(k).value]));v.as_of=c.as_of;v.note=document.getElementById('note').value;v.seen_future=document.getElementById('seen').checked;state.labels[c.case_id]=v;state.reviewer=document.getElementById('reviewer').value;state.independent=document.getElementById('independent').checked;persist()}
function draw(canvas,panel,cursor){const ctx=canvas.getContext('2d'),scale=devicePixelRatio||1,W=canvas.clientWidth,H=310;canvas.width=W*scale;canvas.height=H*scale;ctx.scale(scale,scale);const bars=panel.bars,L=66,R=25,T=32,B=35;if(!bars.length)return;let lo=Math.min(...bars.map(b=>b.l)),hi=Math.max(...bars.map(b=>b.h)),pad=Math.max(.01,(hi-lo)*.08);lo-=pad;hi+=pad;const x=i=>L+(i+.5)*(W-L-R)/bars.length,y=v=>T+(hi-v)*(H-T-B)/(hi-lo);ctx.font='12px system-ui';ctx.fillStyle='#223047';ctx.fillText(panel.cycle,L,20);for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;ctx.strokeStyle='#e5ebf2';ctx.beginPath();ctx.moveTo(L,y(v));ctx.lineTo(W-R,y(v));ctx.stroke();ctx.fillStyle='#52667c';ctx.fillText(v.toFixed(2),5,y(v)+4)}bars.forEach((b,i)=>{ctx.fillStyle=ctx.strokeStyle=b.c>=b.o?'#bd4a51':'#36856e';ctx.beginPath();ctx.moveTo(x(i),y(b.l));ctx.lineTo(x(i),y(b.h));ctx.stroke();const w=Math.max(1,Math.min(8,(W-L-R)/bars.length*.65));ctx.fillRect(x(i)-w/2,y(Math.max(b.o,b.c)),w,Math.max(1,Math.abs(y(b.o)-y(b.c))))});if(document.getElementById('annotations').checked){ctx.strokeStyle='#305fbc';ctx.lineWidth=2;ctx.beginPath();(panel.line||[]).forEach((p,i)=>{i?ctx.lineTo(x(p.i),y(p.y)):ctx.moveTo(x(p.i),y(p.y))});ctx.stroke();ctx.lineWidth=1;ctx.fillStyle='#305fbc';(panel.line||[]).forEach(p=>ctx.fillText(p.label+' '+p.date,Math.min(W-100,x(p.i)+2),Math.max(T,y(p.y)-8)));(panel.levels||[]).forEach(l=>{if(y(l.y)<T||y(l.y)>H-B)return;ctx.setLineDash([4,4]);ctx.strokeStyle='#926d2c';ctx.beginPath();ctx.moveTo(L,y(l.y));ctx.lineTo(W-R,y(l.y));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#926d2c';ctx.fillText(l.label+' '+l.y.toFixed(3),L+5,y(l.y)-5)})}const step=Math.max(1,Math.ceil(bars.length/7));for(let i=0;i<bars.length;i+=step){ctx.fillStyle='#53667c';ctx.fillText(bars[i].date,x(i)-24,H-10)}if(cursor!==undefined){const i=Math.max(0,Math.min(bars.length-1,Math.floor((cursor-L)*bars.length/(W-L-R))));ctx.strokeStyle='#1e2c45';ctx.beginPath();ctx.moveTo(x(i),T);ctx.lineTo(x(i),H-B);ctx.stroke();const b=bars[i];document.getElementById('tip').textContent=b.date+'  开 '+b.o.toFixed(3)+' 高 '+b.h.toFixed(3)+' 低 '+b.l.toFixed(3)+' 收 '+b.c.toFixed(3)}}
function render(){const c=cases[current],v=state.labels[c.case_id]||{};document.getElementById('count').textContent=(current+1)+' / '+cases.length;document.getElementById('title').textContent=c.case_id+' · 截至 '+c.as_of+(c.previously_reviewed?' · 旧审核包案例':' · 新抽样案例');const charts=document.getElementById('charts');charts.replaceChildren();c.panels.forEach(p=>{const canvas=document.createElement('canvas');charts.append(canvas);draw(canvas,p);canvas.onmousemove=e=>draw(canvas,p,e.clientX-canvas.getBoundingClientRect().left);canvas.onmouseleave=()=>draw(canvas,p)});const box=document.getElementById('fields');box.replaceChildren();const prompts=c.kind==='holding'?['这段调整和波谷结构是否成立？','它是否适合作为这笔持仓的保护结构？','截至观察日，上移到候选保护位是否有依据？']:['候选日线N结构是否成立？','A/B/C是否属于合理且一致的波段级别？','截至观察日，结构确认与恢复是否有充分依据？'];fields.forEach((k,i)=>{const label=document.createElement('label');label.textContent=prompts[i]+' ';const select=document.createElement('select');select.id=k;[['','未审核'],['yes','成立'],['no','不成立'],['unclear','看不准']].forEach(([value,text])=>{const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)});select.value=v[k]||'';select.onchange=save;label.append(select);box.append(label)});document.getElementById('note').value=v.note||'';document.getElementById('seen').checked=!!v.seen_future;document.getElementById('tip').textContent='移动鼠标查看当时OHLC';}
document.getElementById('reviewer').value=state.reviewer||'';document.getElementById('independent').checked=!!state.independent;
document.getElementById('prev').onclick=()=>{save();current=(current+cases.length-1)%cases.length;document.getElementById('annotations').checked=false;render()};document.getElementById('next').onclick=()=>{save();current=(current+1)%cases.length;document.getElementById('annotations').checked=false;render()};
document.getElementById('annotations').onchange=render;['note','seen','reviewer','independent'].forEach(k=>document.getElementById(k).addEventListener(k==='note'||k==='reviewer'?'input':'change',save));
document.getElementById('export').onclick=()=>{save();if(!state.reviewer.trim()){document.getElementById('status').textContent='请先填写审核人';return}const payload={...state,schema:'research-stage-review-v1',exported_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=run+'-review.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('status').textContent='已请求导出，请保存下载文件'};
window.addEventListener('resize',render);render();
</script></html>
